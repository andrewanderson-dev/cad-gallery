<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hologram CAD Portfolio Viewer</title>
<style>
  body { margin: 0; overflow: hidden; background: #050a12; font-family: 'Segoe UI', sans-serif; color: #00f3ff; user-select: none; }
  canvas { width: 100vw; height: 100vh; display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(5,15,28,0.75); border: 1px solid rgba(0,243,255,0.45); color: #00f3ff; width: 48px; height: 64px; font-size: 1.6rem; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); transition: 0.2s; z-index: 10; }
  .nav-arrow:hover { background: currentColor; color: #050a12; box-shadow: 0 0 15px currentColor; }
  #prev-model { left: 20px; }
  #next-model { right: 20px; }
  .model-indicator { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; opacity: 0.85; pointer-events: none; text-shadow: 0 0 8px currentColor; }
  .controls-panel { position: absolute; bottom: 20px; left: 20px; background: rgba(5,15,28,0.8); border: 1px solid rgba(0,243,255,0.4); padding: 10px 14px; border-radius: 6px; display: flex; gap: 12px; backdrop-filter: blur(4px); }
  .controls-hint { position: absolute; bottom: 20px; right: 20px; background: rgba(5,15,28,0.65); border: 1px solid rgba(0,243,255,0.25); padding: 10px 14px; border-radius: 6px; font-size: 0.8rem; opacity: 0.85; pointer-events: none; backdrop-filter: blur(4px); }
  button.action-btn { background: rgba(255,255,255,0.08); border: 1px solid #00f3ff; color: #00f3ff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
  button.action-btn:hover, button.action-btn.active { background: #00f3ff; color: #050a12; box-shadow: 0 0 12px #00f3ff; }
</style>
</head>
<body>
  <button id="prev-model" class="nav-arrow">&#10094;</button>
  <button id="next-model" class="nav-arrow">&#10095;</button>
  <div class="controls-panel">
    <button id="toggle-explode" class="action-btn">Exploded View</button>
    <button id="toggle-spin" class="action-btn">Pause Rotation</button>
    <button id="change-color" class="action-btn">Cycle Hologram Color</button>
  </div>
  <div id="model-label" class="model-indicator">01 / 03 // Spur Gear Assembly</div>
  <div class="controls-hint">Hover: Explode &nbsp;|&nbsp; Drag: Rotate &nbsp;|&nbsp; Scroll: Zoom</div>
  <canvas id="holoCanvas"></canvas>

<script>
const canvas = document.getElementById('holoCanvas'), ctx = canvas.getContext('2d');
let width, height;
function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

function addShape(v, e, rOut, rIn, steps, isGear, thick, zOff, expZ, cx = 0, cy = 0) {
  const s = v.length;
  for (let l = 0; l < 2; l++) {
    const z = zOff + (l === 0 ? -thick / 2 : thick / 2);
    for (let i = 0; i < steps; i++) {
      const a = (i / steps) * Math.PI * 2;
      const r = isGear && (i % 4 === 1 || i % 4 === 2) ? rOut : rIn;
      v.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, z, expZ });
    }
  }
  for (let i = 0; i < steps; i++) {
    const n = (i + 1) % steps;
    e.push(new Array(s + i, s + n), new Array(s + steps + i, s + steps + n), new Array(s + i, s + steps + i));
  }
}

const models = [
  (() => {
    const v = [], e = [];
    addShape(v, e, 200, 166, 80, true, 48, 0, 0);
    addShape(v, e, 94, 75, 48, true, 74, 0, 110);
    addShape(v, e, 44, 44, 24, false, 176, 0, -115);
    addShape(v, e, 56, 56, 24, false, 14, 52, 195);
    return { name: '01 / 03 // Spur Gear Assembly', v, e, zMin: -210, zMax: 265 };
  })(),
  (() => {
    const v = [], e = [];
    addShape(v, e, 200, 200, 36, false, 44, 0, 0);
    addShape(v, e, 176, 176, 36, false, 44, 0, 0);
    addShape(v, e, 68, 54, 48, true, 52, 0, -110);
    for (let p = 0; p < 3; p++) {
      const a = (p / 3) * Math.PI * 2, cx = Math.cos(a) * 114, cy = Math.sin(a) * 114;
      addShape(v, e, 54, 42, 40, true, 46, 0, 95, cx, cy);
      addShape(v, e, 18, 18, 16, false, 68, 0, 185, cx, cy);
    }
    return { name: '02 / 03 // Planetary Drive System', v, e, zMin: -160, zMax: 240 };
  })(),
  (() => {
    const v = [], e = [];
    addShape(v, e, 185, 185, 32, false, 24, -22, -90);
    addShape(v, e, 70, 70, 24, false, 90, -55, -155);
    addShape(v, e, 185, 185, 32, false, 24, 22, 90);
    addShape(v, e, 70, 70, 24, false, 90, 55, 155);
    for (let b = 0; b < 6; b++) {
      const a = (b / 6) * Math.PI * 2;
      addShape(v, e, 16, 16, 12, false, 76, 0, 210, Math.cos(a) * 135, Math.sin(a) * 135);
    }
    return { name: '03 / 03 // Flanged Shaft Coupler', v, e, zMin: -220, zMax: 260 };
  })()
];

let mIdx = 0, rotX = 0.18, rotY = -0.55, zoom = 1.0, autoSpin = true, isExp = false, isHovering = false, expP = 0, drag = false, lastM = { x: 0, y: 0 }, cIdx = 0;
const colors = new Array('#00f3ff', '#ffffff', '#00ff88', '#ff9900', '#b84dff');

function applyThemeColor(c) {
  document.body.style.color = c;
  document.querySelectorAll('.nav-arrow, .action-btn').forEach(b => {
    b.style.borderColor = c;
    b.style.color = b.classList.contains('active') ? '#050a12' : c;
    b.style.background = b.classList.contains('active') ? c : 'rgba(5,15,28,0.75)';
  });
}

function switchModel(d) {
  mIdx = (mIdx + d + models.length) % models.length;
  document.getElementById('model-label').textContent = models.at(mIdx).name;
}
document.getElementById('prev-model').onclick = () => switchModel(-1);
document.getElementById('next-model').onclick = () => switchModel(1);
window.onkeydown = (e) => { if (e.key === 'ArrowLeft') switchModel(-1); if (e.key === 'ArrowRight') switchModel(1); };

canvas.onmousedown = (e) => { drag = true; lastM = { x: e.clientX, y: e.clientY }; };
window.onmouseup = () => drag = false;
canvas.onmouseleave = () => { isHovering = false; };
window.onmousemove = (e) => {
  if (drag) {
    rotY += (e.clientX - lastM.x) * 0.008;
    rotX = Math.max(-1.4, Math.min(1.4, rotX + (e.clientY - lastM.y) * 0.008));
    lastM = { x: e.clientX, y: e.clientY };
  }
  const hitRadius = Math.min(width, height) * 0.38 * zoom;
  const distFromCenter = Math.hypot(e.clientX - width / 2, e.clientY - height / 2);
  isHovering = e.target === canvas && distFromCenter <= hitRadius;
};
canvas.addEventListener('wheel', (e) => { e.preventDefault(); zoom = Math.max(0.3, Math.min(2.5, zoom * (e.deltaY > 0 ? 0.92 : 1.08))); }, { passive: false });

document.getElementById('toggle-explode').onclick = (e) => {
  isExp = !isExp;
  e.target.classList.toggle('active', isExp);
  e.target.textContent = isExp ? 'Collapse View' : 'Exploded View';
  applyThemeColor(colors.at(cIdx));
};
document.getElementById('toggle-spin').onclick = (e) => { autoSpin = !autoSpin; e.target.textContent = autoSpin ? 'Pause Rotation' : 'Resume Rotation'; };
document.getElementById('change-color').onclick = () => {
  cIdx = (cIdx + 1) % colors.length;
  applyThemeColor(colors.at(cIdx));
};

function project(pt) {
  const zC = pt.z + (pt.expZ || 0) * expP;
  const cY = Math.cos(rotY), sY = Math.sin(rotY), x = pt.x * cY - zC * sY;
  let z = zC * cY + pt.x * sY;
  const cX = Math.cos(rotX), sX = Math.sin(rotX), y = pt.y * cX - z * sX;
  z = z * cX + pt.y * sX;
  const scale = ((Math.min(width, height) * 0.41) / 200) * (750 / (750 + z)) * zoom;
  return { x: width / 2 + x * scale, y: height / 2 + y * scale };
}

function render() {
  if (autoSpin && !drag) rotY += 0.002;
  const targetExp = (isExp || isHovering) ? 1 : 0;
  expP += (targetExp - expP) * 0.08;
  ctx.fillStyle = '#050a12';
  ctx.fillRect(0, 0, width, height);

  const col = colors.at(cIdx), mod = models.at(mIdx);
  if (expP > 0.02) {
    const a1 = project({ x: 0, y: 0, z: mod.zMin * expP }), a2 = project({ x: 0, y: 0, z: mod.zMax * expP });
    ctx.save(); ctx.setLineDash(new Array(6, 6)); ctx.strokeStyle = col; ctx.globalAlpha = 0.35 * expP; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(a1.x, a1.y); ctx.lineTo(a2.x, a2.y); ctx.stroke(); ctx.restore();
  }

  const proj = mod.v.map(project);
  ctx.shadowBlur = 14; ctx.shadowColor = col; ctx.strokeStyle = col; ctx.globalAlpha = 0.88; ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (const pair of mod.e) { ctx.moveTo(proj.at(pair.at(0)).x, proj.at(pair.at(0)).y); ctx.lineTo(proj.at(pair.at(1)).x, proj.at(pair.at(1)).y); }
  ctx.stroke();
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
