<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hologram CAD Portfolio Viewer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050a12;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #00f3ff;
    }
    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    .hud-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      pointer-events: none;
      border-left: 3px solid #00f3ff;
      padding-left: 15px;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.7);
    }
    .hud-overlay h1 {
      margin: 0 0 5px 0;
      font-size: 1.4rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .hud-overlay p {
      margin: 0;
      font-size: 0.85rem;
      color: #80f9ff;
    }
    .controls-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(5, 15, 28, 0.8);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 12px 16px;
      border-radius: 6px;
      display: flex;
      gap: 15px;
      align-items: center;
      backdrop-filter: blur(4px);
    }
    button {
      background: rgba(0, 243, 255, 0.15);
      border: 1px solid #00f3ff;
      color: #00f3ff;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    button:hover {
      background: #00f3ff;
      color: #050a12;
      box-shadow: 0 0 12px #00f3ff;
    }
  </style>
</head>
<body>

  <div class="hud-overlay">
    <h1>CAD Projection // Active</h1>
    <p>Drag: Rotate | Scroll: Zoom</p>
  </div>

  <div class="controls-panel">
    <button id="toggle-spin">Pause Rotation</button>
    <button id="change-color">Cycle Hologram Color</button>
  </div>

  <canvas id="holoCanvas"></canvas>

  <script>
    const canvas = document.getElementById('holoCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Build a 3D Mechanical Gear Mesh (Vertices + Edges)
    const vertices = [];
    const edges = [];

    function addGear(outerR, innerR, teeth, thickness, yOffset) {
      const startIdx = vertices.length;
      const steps = teeth * 4;
      for (let layer = 0; layer < 2; layer++) {
        const y = yOffset + (layer === 0 ? -thickness / 2 : thickness / 2);
        for (let i = 0; i < steps; i++) {
          const angle = (i / steps) * Math.PI * 2;
          const isTooth = (i % 4 === 1 || i % 4 === 2);
          const r = isTooth ? outerR : innerR;
          vertices.push({ x: Math.cos(angle) * r, y: y, z: Math.sin(angle) * r });
        }
      }
      for (let i = 0; i < steps; i++) {
        const next = (i + 1) % steps;
        // Top ring, bottom ring, and vertical struts
        edges.push([startIdx + i, startIdx + next]);
        edges.push([startIdx + steps + i, startIdx + steps + next]);
        edges.push([startIdx + i, startIdx + steps + i]);
      }
    }

    function addRing(radius, segments, yOffset) {
      const startIdx = vertices.length;
      for (let i = 0; i < segments; i++) {
        const angle = (i / segments) * Math.PI * 2;
        vertices.push({ x: Math.cos(angle) * radius, y: yOffset, z: Math.sin(angle) * radius });
        edges.push([startIdx + i, startIdx + ((i + 1) % segments)]);
      }
    }

    // Create Main Gear, Inner Hub, and Central Shaft
    addGear(140, 115, 18, 36, 0);
    addGear(65, 52, 12, 55, 0);
    addRing(30, 24, -65);
    addRing(30, 24, 65);
    // Shaft vertical lines
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2;
      const idx = vertices.length;
      vertices.push({ x: Math.cos(angle) * 30, y: -65, z: Math.sin(angle) * 30 });
      vertices.push({ x: Math.cos(angle) * 30, y: 65, z: Math.sin(angle) * 30 });
      edges.push([idx, idx + 1]);
    }

    // Hologram Floor Grid
    const gridLines = [];
    const gridSize = 260;
    const gridStep = 40;
    for (let g = -gridSize; g <= gridSize; g += gridStep) {
      gridLines.push([{ x: g, y: 110, z: -gridSize }, { x: g, y: 110, z: gridSize }]);
      gridLines.push([{ x: -gridSize, y: 110, z: g }, { x: gridSize, y: 110, z: g }]);
    }

    // Camera & Interaction State
    let rotX = 0.45;
    let rotY = 0.0;
    let zoom = 1.0;
    let autoSpin = true;
    let isDragging = false;
    let lastMouse = { x: 0, y: 0 };

    const colors = ['#00f3ff', '#00ff88', '#ff9900', '#b84dff'];
    let colorIdx = 0;

    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      lastMouse = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      rotY += (e.clientX - lastMouse.x) * 0.008;
      rotX += (e.clientY - lastMouse.y) * 0.008;
      rotX = Math.max(-1.4, Math.min(1.4, rotX));
      lastMouse = { x: e.clientX, y: e.clientY };
    });
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoom *= e.deltaY > 0 ? 0.92 : 1.08;
      zoom = Math.max(0.4, Math.min(2.5, zoom));
    }, { passive: false });

    document.getElementById('toggle-spin').addEventListener('click', (e) => {
      autoSpin = !autoSpin;
      e.target.textContent = autoSpin ? 'Pause Rotation' : 'Resume Rotation';
    });
    document.getElementById('change-color').addEventListener('click', () => {
      colorIdx = (colorIdx + 1) % colors.length;
      const c = colors.at(colorIdx);
      document.body.style.color = c;
      document.querySelector('.hud-overlay').style.borderLeftColor = c;
      document.querySelector('.hud-overlay p').style.color = c;
    });

    function project(pt) {
      // Rotate Y
      const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
      let x = pt.x * cosY - pt.z * sinY;
      let z = pt.z * cosY + pt.x * sinY;
      // Rotate X
      const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
      let y = pt.y * cosX - z * sinX;
      z = z * cosX + pt.y * sinX;

      const fov = 550 * zoom;
      const scale = fov / (fov + z + 350);
      return {
        x: width / 2 + x * scale,
        y: height / 2 + y * scale,
        z: z
      };
    }

    let time = 0;
    function render() {
      time += 0.04;
      if (autoSpin && !isDragging) rotY += 0.008;

      ctx.fillStyle = '#050a12';
      ctx.fillRect(0, 0, width, height);

      const mainColor = colors.at(colorIdx);

      // Draw Floor Grid
      ctx.strokeStyle = mainColor;
      ctx.globalAlpha = 0.14;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (const [p1, p2] of gridLines) {
        const a = project(p1);
        const b = project(p2);
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
      }
      ctx.stroke();

      // Draw Glowing Hologram Gear
      const projected = vertices.map(project);
      ctx.shadowBlur = 12;
      ctx.shadowColor = mainColor;
      ctx.strokeStyle = mainColor;
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = 1.5;

      ctx.beginPath();
      for (const [i, j] of edges) {
        ctx.moveTo(projected.at(i).x, projected.at(i).y);
        ctx.lineTo(projected.at(j).x, projected.at(j).y);
      }
      ctx.stroke();

      // Draw Animated Hologram Scanline Sweep
      const scanY = (height / 2) + Math.sin(time) * 140 * zoom;
      const grad = ctx.createLinearGradient(0, scanY - 25, 0, scanY + 25);
      grad.addColorStop(0, 'transparent');
      grad.addColorStop(0.5, mainColor);
      grad.addColorStop(1, 'transparent');
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = grad;
      ctx.fillRect(width / 2 - 220 * zoom, scanY - 25, 440 * zoom, 50);

      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1.0;
      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
